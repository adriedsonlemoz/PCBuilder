name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências
        run: npm install

      - name: Executar testes
        run: npm test

      - name: Gerar aplicação web
        run: npm run build

      - name: Criar projeto Android do Capacitor
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Preparar ferramenta de ícones
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Configurar Adaptive Icon do Meu PC
        run: bash .github/scripts/apply-android-icon.sh

      - name: Verificar Adaptive Icon e remover referências antigas
        run: bash .github/scripts/verify-android-icon.sh

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar debug e release
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease

      - name: Nomear APK debug com a versão
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "MeuPC-${VERSION}-debug.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MeuPC-APK
          path: MeuPC-*-debug.apk
          if-no-files-found: error
          retention-days: 30
