name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências
        run: npm install

      - name: Gerar aplicação web
        run: npm run build

      - name: Criar projeto Android do Capacitor
        run: npx cap add android

      - name: Sincronizar arquivos web
        run: npx cap sync android

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Nomear APK com a versão
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "ConstruirPC-${VERSION}-debug.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ConstruirPC-APK
          path: ConstruirPC-*-debug.apk
          if-no-files-found: error
          retention-days: 30
